name: Lichess Bot Runner

concurrency:
  group: lichess-bot-runner
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Bot Mode'
        type: choice
        required: true
        options:
          - normal
          - matchmaking
          - tournament
      tournament_id:
        description: 'Tournament ID (if tournament mode)'
        type: string
        required: false
      team_id:
        description: 'Team ID (optional)'
        type: string
        required: false
      password:
        description: 'Tournament password (optional)'
        type: string
        required: false
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'config.yml'

permissions:
  actions: write
  contents: write

jobs:
  bot-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 355 # restart just before GitHub limit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11.18'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt not found, skipping..."
          fi
          pip install tenacity pyyaml 

      - name: Setup Engines
        run: |
          if [ -f engines/stockfish ]; then
            chmod +x engines/stockfish
          else
            echo "⚠️ Stockfish engine not found in engines/"
          fi

      - name: Inject Lichess Bot Token
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, yaml
          token = os.environ.get("LICHESS_TOKEN")
          if not token:
              print("ERROR: LICHESS_TOKEN secret is missing!")
              exit(1)
          
          if not os.path.exists("config.yml"):
              with open("config.yml", "w") as f:
                  f.write("{}")

          with open("config.yml","r") as f:
              config = yaml.safe_load(f) or {}
          config["token"] = token
          with open("config.yml","w") as f:
              yaml.dump(config, f, default_flow_style=False)
          print("✅ Token injected successfully")
          EOF

      - name: Launch Bot with Auto-Restart
        run: |
          CMD_BASE='python3 -u user_interface.py "matchmaking" "tournament H9R6QavB"'
          MODE="${{ github.event.inputs.mode }}"
          TOUR_ID="${{ github.event.inputs.tournament_id }}"
          TEAM_ID="${{ github.event.inputs.team_id }}"
          PASSWORD="${{ github.event.inputs.password }}"

          if [[ "$MODE" == "matchmaking" ]]; then
              CMD="$CMD_BASE matchmaking"
          elif [[ "$MODE" == "tournament" ]]; then
              if [[ -z "$TOUR_ID" ]]; then
                  echo "⚠️ Tournament ID missing. Default mode."
                  CMD="$CMD_BASE"
              else
                  ARGS="4jYqxDPn"
                  [[ -n "$TEAM_ID" ]] && ARGS="$ARGS $TEAM_ID"
                  [[ -n "$PASSWORD" ]] && ARGS="$ARGS $PASSWORD"
                  CMD="$CMD_BASE \"tournament $ARGS\""
              fi
          else
              echo "⚠️ Mode not recognized. Running normal mode."
              CMD="$CMD_BASE"
          fi

          echo "🤖 Running command: $CMD"
          
          eval "$CMD" &
          BOT_PID=$!

          ( sleep 20700 && echo "⏰ Time's up. Restarting bot..." && kill -SIGTERM $BOT_PID ) &
          TIMER_PID=$!

          wait $BOT_PID
          echo "Bot ended cleanly."
          
          kill $TIMER_PID 2>/dev/null || true
